<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9F6FD"/>
      <stop offset="1" stop-color="#D3F3EC"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0B4F7C" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="800" height="700" fill="url(#bg)"/>
  <!-- כביש -->
  <path d="M-20 640 C 200 560, 420 600, 820 500 L 820 720 L -20 720 Z" fill="#3A4750"/>
  <path d="M40 640 C 230 585, 430 615, 800 540" fill="none" stroke="#fff" stroke-width="8" stroke-dasharray="40 30" opacity=".85"/>
  <!-- רמזור -->
  <g transform="translate(640 150)" filter="url(#sh)">
    <rect x="-8" y="250" width="16" height="190" fill="#5E686D"/>
    <rect x="-48" y="0" width="96" height="260" rx="28" fill="#2F3437"/>
    <circle cx="0" cy="55" r="30" fill="#E2448F"/>
    <circle cx="0" cy="130" r="30" fill="#F5B82E"/>
    <circle cx="0" cy="205" r="30" fill="#1BA37F"/>
  </g>
  <!-- בועות -->
  <g filter="url(#sh)" font-family="Assistant, Heebo, Arial, sans-serif" font-weight="700" text-anchor="middle">
    <g transform="translate(300 170)">
      <path d="M-200 -80 h400 a40 40 0 0 1 40 40 v90 a40 40 0 0 1 -40 40 h-260 l-60 55 l10 -55 h-90 a40 40 0 0 1 -40 -40 v-90 a40 40 0 0 1 40 -40z" fill="#0181C9"/>
      <text x="20" y="35" font-size="96" fill="#fff">שלום!</text>
    </g>
    <g transform="translate(330 400)">
      <path d="M-210 -70 h420 a40 40 0 0 1 40 40 v80 a40 40 0 0 1 -40 40 h-90 l10 55 l-60 -55 h-270 a40 40 0 0 1 -40 -40 v-80 a40 40 0 0 1 40 -40z" fill="#fff"/>
      <text x="0" y="40" font-size="80" fill="#0B4F7C">נעים להכיר</text>
    </g>
  </g>
</svg>
